<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient for Badges/Borders -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 14s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      .flow-pulse-reverse {
        stroke-dasharray: 6 10;
        animation: dashMoveRev 18s linear infinite;
      }
      .card-float-1 {
        animation: floatCard1 6s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: floatCard2 7s ease-in-out infinite alternate;
      }
      .card-float-3 {
        animation: floatCard3 8s ease-in-out infinite alternate;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashMoveRev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
        100% { transform: translate(-40px, -20px) scale(0.9); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-50px, -40px) scale(1.2); }
        100% { transform: translate(30px, 20px) scale(0.95); }
      }
      @keyframes floatCard1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Atmosphere Orbs (Behind content) -->
  <g opacity="0.85">
    <circle class="glow-orb-1" cx="220" cy="140" r="180" fill="url(#orbGrad1)" />
    <circle class="glow-orb-2" cx="980" cy="220" r="220" fill="url(#orbGrad2)" />
    <circle cx="600" cy="360" r="160" fill="url(#orbGrad3)" />
  </g>

  <!-- Dynamic Cyber Flow Waves / Connection Circuits (Midground) -->
  <g opacity="0.35">
    <path class="flow-pulse" d="M -50 80 Q 300 20 600 90 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-pulse-reverse" d="M -50 340 Q 350 400 700 310 T 1250 350" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="flow-pulse" d="M 100 420 C 350 280 850 450 1150 180" fill="none" stroke="#34d399" stroke-width="1.5" />
  </g>

  <!-- Floating Financial Tech Diagram Cards (Right Side / Background Decoration) -->
  <g opacity="0.88">
    <!-- Card 1: Credit Note Issued -->
    <g class="card-float-1" transform="translate(860, 60)">
      <rect width="280" height="80" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="36" cy="40" r="18" fill="#0369a1" fill-opacity="0.5" />
      <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">📄</text>
      <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Credit Memo Issued</text>
      <text x="68" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">CR-2026-0894 • -$2,450.00</text>
      <rect x="205" y="24" width="60" height="20" rx="10" fill="#0284c7" fill-opacity="0.3" />
      <text x="235" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">APPLIED</text>
    </g>

    <!-- Card 2: B2B Credit Risk Scoring -->
    <g class="card-float-2" transform="translate(880, 160)">
      <rect width="280" height="80" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="36" cy="40" r="18" fill="#4338ca" fill-opacity="0.5" />
      <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#818cf8" text-anchor="middle">🛡️</text>
      <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Credit Risk Monitor</text>
      <text x="68" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">D&amp;B / Experian PAYDEX: 88/100</text>
      <rect x="215" y="24" width="50" height="20" rx="10" fill="#10b981" fill-opacity="0.25" />
      <text x="240" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">LOW RISK</text>
    </g>

    <!-- Card 3: AR Automation / Cash App -->
    <g class="card-float-3" transform="translate(840, 260)">
      <rect width="290" height="80" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="36" cy="40" r="18" fill="#065f46" fill-opacity="0.5" />
      <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">⚡</text>
      <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">AR Cash Application</text>
      <text x="68" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Auto-Matched Remittance 99.4%</text>
      <rect x="220" y="24" width="55" height="20" rx="10" fill="#059669" fill-opacity="0.3" />
      <text x="247" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#6ee7b7" text-anchor="middle">SYNCED</text>
    </g>
  </g>

  <!-- FOREGROUND: Top Header Pills & Category Indicator -->
  <g transform="translate(60, 55)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="0.5">FINTECH ECOSYSTEM</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="194" cy="14" r="5" fill="#818cf8" />
    <text x="207" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">OPEN-SOURCE &amp; SAAS</text>

    <!-- Pill 3 -->
    <rect x="337" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="351" cy="14" r="5" fill="#34d399" />
    <text x="364" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#6ee7b7" letter-spacing="0.5">CURATED LIST</text>
  </g>

  <!-- FOREGROUND: MAIN TITLE (Never blocked or hidden) -->
  <g transform="translate(60, 145)">
    <!-- Title Shadow for Contrast -->
    <text x="1" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#000000" fill-opacity="0.6" letter-spacing="-0.5">
      Awesome Credit Notes &amp;
    </text>
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Credit Notes &amp;
    </text>

    <text x="1" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#000000" fill-opacity="0.6" letter-spacing="-0.5">
      Accounts Receivable Credit
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Accounts Receivable Credit
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated B2B Credit Memos, AR Automation, Invoice-to-Cash &amp; Risk Intelligence
    </text>
  </g>

  <!-- Bottom Feature Micro-Pills -->
  <g transform="translate(60, 315)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">🧾 Credit Note Issuance</text>
    </g>
    <!-- Feature 2 -->
    <g transform="translate(182, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">⚡ Invoice-to-Cash (AR)</text>
    </g>
    <!-- Feature 3 -->
    <g transform="translate(374, 0)">
      <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">📊 B2B Credit Risk Data</text>
    </g>
    <!-- Feature 4 -->
    <g transform="translate(561, 0)">
      <rect width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="0.8" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">💻 Self-Hosted &amp; FOSS</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>